name: Fork Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tonkatsu-box-watch.p12"

      # Split per ABI: libmpv for four ABIs in one APK would be huge.
      # Without repository secrets the API keys are empty and the app asks
      # for its own keys in Settings -> API Keys.
      - name: Build Android APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/tonkatsu-box-watch.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          --dart-define=TVDB_API_KEY=${{ secrets.TVDB_API_KEY }}
          --dart-define=STEAMGRIDDB_API_KEY=${{ secrets.STEAMGRIDDB_API_KEY }}
          --dart-define=IGDB_CLIENT_ID=${{ secrets.IGDB_CLIENT_ID }}
          --dart-define=IGDB_CLIENT_SECRET=${{ secrets.IGDB_CLIENT_SECRET }}
          --dart-define=SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}
          --dart-define=SCREENSCRAPER_DEV_PASSWORD=${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          --dart-define=PODCASTINDEX_API_KEY=${{ secrets.PODCASTINDEX_API_KEY }}
          --dart-define=PODCASTINDEX_API_SECRET=${{ secrets.PODCASTINDEX_API_SECRET }}
          --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tonkatsu-box-watch-android
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
